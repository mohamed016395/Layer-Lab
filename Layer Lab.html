<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layer Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#14213d;--muted:#4a5878;--teal:#00a6a6;--pink:#e63e8b;--yellow:#ffc93c;--line:#d3dbe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--surface:#18223a;--ink:#eef2f9;--muted:#a3b0cc;--line:#2c3a5c}}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#18223a;--ink:#eef2f9;--muted:#a3b0cc;--line:#2c3a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Bricolage Grotesque",system-ui,sans-serif;line-height:1.6}
body.en{font-family:"Bricolage Grotesque","Tajawal",system-ui,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:10px}
.brand{font-weight:800;font-size:1.3rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.nav .btn{padding:8px 12px;font-size:.9rem}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;padding:10px 18px;cursor:pointer;text-decoration:none;text-align:center}
.btn.alt{background:var(--yellow);color:#14213d}.btn.teal{background:var(--teal);color:#fff}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.layers{height:40px;border-radius:10px;margin:20px 0;background:repeating-linear-gradient(0deg,var(--teal) 0 5px,transparent 5px 9px);width:min(100%,300px)}
h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.1;margin:0 0 10px;font-weight:800}
h2{font-size:1.6rem;margin:0 0 16px}
.sub{color:var(--muted);max-width:46ch;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding-bottom:90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:140px;display:grid;place-items:center;background:var(--bg)}.obj{width:86px;height:86px}
.body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.body h3{margin:0}.body p{margin:0;color:var(--muted);flex:1;font-size:.95rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.price{font-weight:800}
#cartBtn{position:fixed;inset-inline-end:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:999px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cnt{background:var(--pink);color:#fff;border-radius:999px;padding:0 8px;margin-inline-start:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:60px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--teal)}
label{display:grid;gap:4px;font-weight:700;margin-bottom:12px}
input[type=text],input[type=tel],input[type=password],input[type=email]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.phone{display:flex;gap:6px;direction:ltr}.phone span{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.qty b{display:inline-block;min-width:24px;text-align:center}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;font-weight:700}
.opt small{display:block;font-weight:400;color:var(--muted)}
.opt:has(input:checked){border-color:var(--teal)}
.err{color:var(--pink);font-weight:700;min-height:1.5em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:18px}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
select{font:inherit;padding:4px 8px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Layer Lab</div>
    <div class="nav"><button class="btn ghost" id="accBtn"></button><button class="btn ghost" id="trackNav" data-t="track"></button><button class="btn ghost" id="langBtn"></button></div></div>

  <section id="v-shop">
    <div class="layers" aria-hidden="true"></div>
    <h1 data-t="hero"></h1><p class="sub" data-t="heroSub"></p>
    <h2 style="margin-top:28px" data-t="shop"></h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-flow" hidden>
    <div class="panel">
      <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
      <div id="s0"><h2 data-t="cart"></h2><div id="items"></div><p class="muted" id="empty" data-t="empty"></p>
        <div class="actions"><button class="btn ghost" data-go="shop" data-t="more"></button><button class="btn teal" id="toS1" data-t="checkout"></button></div></div>
      <div id="s1" hidden><h2 data-t="s1"></h2>
        <label><span data-t="name"></span><input type="text" id="fName" autocomplete="name"></label>
        <label><span data-t="phone"></span><div class="phone"><span>+971</span><input type="tel" id="fPhone" inputmode="numeric" maxlength="10" placeholder="5XXXXXXXX" autocomplete="tel-national"></div></label>
        <div class="err" id="e1" role="alert"></div>
        <div class="actions"><button class="btn ghost" data-step="0" data-t="back"></button><button class="btn teal" id="toS2" data-t="next"></button></div></div>
      <div id="s2" hidden><h2 data-t="s2"></h2>
        <label><span data-t="city"></span><input type="text" id="fCity"></label>
        <label><span data-t="area"></span><input type="text" id="fArea"></label>
        <label><span data-t="house"></span><input type="text" id="fHouse"></label>
        <label><span data-t="land"></span><input type="text" id="fLand"></label>
        <div class="err" id="e2" role="alert"></div>
        <div class="actions"><button class="btn ghost" data-step="1" data-t="back"></button><button class="btn teal" id="toS3" data-t="toPay"></button></div></div>
      <div id="s3" hidden><h2 data-t="s3"></h2>
        <label class="opt"><input type="radio" name="pay" value="cash" checked><span><span data-t="cash"></span><small data-t="cashN"></small></span></label>
        <label class="opt"><input type="radio" name="pay" value="card"><span><span data-t="card"></span><small data-t="cardN"></small></span></label>
        <div class="actions" style="margin:0 0 10px"><button class="btn ghost" id="offBtn" type="button"></button></div>
        <div id="sum"></div>
        <div class="err" id="e3" role="alert"></div>
        <div class="actions"><button class="btn ghost" data-step="2" data-t="back"></button><a class="btn alt" id="send" target="_blank" rel="noopener" href="#" data-t="send"></a></div></div>
      <div id="s4" hidden><h2 data-t="thanks"></h2><p id="orderNo" style="font-weight:800;font-size:1.3rem"></p><p id="thanksP"></p><p id="shot" class="muted"></p>
        <div class="actions"><a class="btn teal" id="trackWa" target="_blank" rel="noopener" href="#" data-t="trackBtn"></a><button class="btn ghost" data-go="shop" data-t="home"></button></div></div>
    </div>
  </section>

  <section id="v-track" hidden>
    <div class="panel"><h2 data-t="track"></h2><p class="muted" data-t="trackP"></p>
      <label><span data-t="orderNum"></span><input type="text" id="tNo" placeholder="LL-1234" dir="ltr"></label>
      <div class="actions"><a class="btn teal" id="tGo" target="_blank" rel="noopener" href="#" data-t="trackBtn"></a><button class="btn ghost" data-go="shop" data-t="home"></button></div></div>
  </section>
</div>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mbody"></div></div></div>
<button class="btn alt" id="cartBtn" hidden><span aria-hidden="true">🛒</span> <span data-t="cart"></span><span id="cnt">0</span></button>

function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
function hashPw(pw,sh){
  var salt=new Uint8Array(sh.match(/../g).map(function(h){return parseInt(h,16)}));
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},k,256)}).then(hex);
}
async function authGo(m){
  var err=$("aErr"),d=$("aPhone").value.replace(/\D/g,""),pw=$("aPass").value;
  if(d.charAt(0)==="0")d=d.slice(1);
  if(d.length!==9){err.textContent=tr("badP");return}
  if(pw.length<6){err.textContent=tr("passShort");return}
  try{
    if(m==="up"){
      var n=$("aName").value.trim();if(!n){err.textContent=tr("e1");return}
      if(acct&&acct.p===d&&acct.h){err.textContent=tr("exists");return}
      var s=hex(crypto.getRandomValues(new Uint8Array(16)));
      acct={n:n,p:d,s:s,h:await hashPw(pw,s)};
    }else{
      if(!acct||acct.p!==d){err.textContent=tr("noAcct");return}
      if(!acct.h){err.textContent=tr("reAcct");return}
      if(await hashPw(pw,acct.s)!==acct.h){err.textContent=tr("wrongPass");return}
    }
  }catch(x){err.textContent=tr("noCrypto");return}
  logged=true;try{localStorage.setItem("ll_acct",JSON.stringify(acct));localStorage.setItem("ll_in","1")}catch(x){}
  if(!$("fName").value)$("fName").value=acct.n;if(!$("fPhone").value)$("fPhone").value=acct.p;
  closeModal();renderAcc();renderSum();refresh();
}

function parseOrder(m){
  var c=m.match(/Code:\s*([\dx;]+)/);if(!c)return null;
  var sub=0,items=[],ok=true;
  c[1].split(";").forEach(function(t){var z=t.split("x"),i=+z[0],q=+z[1];if(!P[i]||!(q>0)||q>99||q%1){ok=false;return}sub+=P[i].p*q;items.push(P[i].en+" × "+q)});
  if(!ok||!items.length)return null;
  var mem=/Registered member|عضو مسجّل/.test(m),off=/Offer:|العرض:/.test(m);
  var f=sub>100?0:FEE,d=(mem&&off&&sub>170)?r2(sub*0.18):0,real=r2(sub-d+f);
  var g=function(re){var x=m.match(re);return x?x[1].trim():""};
  var cl=g(/(?:Total|المجموع):\s*(?:AED\s*)?([\d.]+)/);
  return {no:(m.match(/LL-\d+/)||[""])[0],name:g(/(?:Name|الاسم):\s*(.*)/),phone:g(/\+971\s*(\d+)/),pay:/Card|بطاقة/.test(m)?"Card":"Cash",items:items.join(", "),real:real,claimed:cl,bad:cl===""||Math.abs(+cl-real)>0.01,st:/Card|بطاقة/.test(m)?"wait":"new",gift:"",email:g(/(?:Email|الإيميل):\s*(\S+)/),city:g(/(?:City|المدينة):\s*(.*)/),area:g(/(?:Area|المنطقة):\s*(.*)/),house:g(/(?:House|رقم البيت):\s*(.*)/),land:g(/(?:Landmark|أقرب معلم):\s*(.*)/),lang:/[\u0600-\u06FF]/.test(m)?"ar":"en"};
}

async function saveProfile(){
